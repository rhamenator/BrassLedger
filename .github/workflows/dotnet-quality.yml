name: .NET Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: brassledger_test
          POSTGRES_USER: brassledger
          POSTGRES_PASSWORD: brassledger-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brassledger -d brassledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BRASSLEDGER_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=brassledger_test;Username=brassledger;Password=brassledger-ci-only;Include Error Detail=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BrassLedger.slnx
      - run: dotnet build BrassLedger.slnx --configuration Release --no-restore --nologo
      - name: Test API and infrastructure
        shell: pwsh
        run: |
          dotnet test BrassLedger.Api.Tests/BrassLedger.Api.Tests.csproj --configuration Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test BrassLedger.Infrastructure.Tests/BrassLedger.Infrastructure.Tests.csproj --configuration Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test UI and browser journeys sequentially
        shell: pwsh
        run: ./run-ui-tests.ps1 -InstallBrowsers -Configuration Release
      - name: Upload Linux Chromium baselines
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-linux-snapshots
          path: BrassLedger.Web.E2E.Tests/Snapshots/chromium-linux
          if-no-files-found: warn
